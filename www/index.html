<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sun Camera</title>
<style>
  :root{
    --bg:#1b1210; --panel:#2a1e1a; --panel2:#3a2a24; --text:#f5ede8; --muted:#b9a79f;
    --accent:#e07a5f; --accent2:#f2a68c; --frame:rgba(255,190,160,.9); --ok:#7fbf7f; --btn:rgba(255,255,255,.08);
  }
  body.light{
    --bg:#faf5f0; --panel:#ffffff; --panel2:#f1e6de; --text:#2b2320; --muted:#8a7a72;
    --accent:#d96a4a; --accent2:#c05738; --frame:rgba(200,90,60,.9); --ok:#3f8f3f; --btn:rgba(0,0,0,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,'Roboto','Segoe UI',sans-serif; touch-action:none;}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;background:var(--bg)}
  #start h1{margin:0;font-size:24px}
  #start button{font-size:17px;padding:14px 28px;border-radius:14px;border:none;background:var(--accent);color:#fff}
  #cam{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;display:none;z-index:1}
  #cam.scale{transform-origin:center center}
  #ui{position:fixed;inset:0;z-index:10;display:none;pointer-events:none}
  #ui > *{pointer-events:auto}
  .topbar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:20px;padding:10px 14px;font-size:15px;font-weight:600}
  .chip.active{background:var(--accent)}
  .spacer{flex:1}
  #modeLabel{position:absolute;left:0;right:0;text-align:center;color:var(--frame);font-weight:700;font-size:16px;
    text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
  #frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid var(--frame);
    border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.28);pointer-events:none;z-index:9}
  .botbar{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
  #zoomRow{display:flex;gap:14px;align-items:center}
  #zoomRow button{background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:22px;width:52px;height:44px;font-size:20px}
  #zoomVal{color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7)}
  #rotateBtn{background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:18px;padding:10px 18px;font-size:15px;font-weight:600}
  #shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #toast{position:absolute;left:12px;right:12px;bottom:calc(120px + env(safe-area-inset-bottom));background:rgba(30,20,15,.88);color:#fff;
    border-radius:12px;padding:10px 14px;font-size:14px;display:none;pointer-events:none;z-index:20}
  /* Настройки */
  #settings{position:fixed;inset:0;z-index:40;display:none}
  #settings .back{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  #sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto}
  #sheet h3{margin:0 0 4px 0;font-size:18px}
  #sheet p{margin:0 0 12px 0;color:var(--muted);font-size:13px}
  .fold{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--text);border:none;border-radius:12px;
    padding:13px 14px;font-size:15px;margin-bottom:8px;font-weight:600}
  .fold.sel{background:var(--accent);color:#fff}
  .fold small{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
  #sheetClose{width:100%;border:none;background:var(--btn);color:var(--text);border-radius:12px;padding:12px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<div id="start">
  <h1>Sun Camera</h1>
  <div style="color:var(--muted);text-align:center;padding:0 30px">Съёмка по стандартам сайта: сторис и фото работ</div>
  <button id="startBtn">Включить камеру</button>
</div>
<video id="cam" autoplay playsinline muted></video>
<div id="ui">
  <div class="topbar">
    <button class="chip" id="mStory">Сторис</button>
    <button class="chip active" id="mWork">Работы</button>
    <div class="spacer"></div>
    <button class="chip" id="switchCam">Камера ⇄</button>
    <button class="chip" id="themeBtn">Тёмная</button>
    <button class="chip" id="settingsBtn">⚙ Настройки</button>
  </div>
  <div id="modeLabel"></div>
  <div id="frame"></div>
  <div class="botbar">
    <div id="zoomRow">
      <button id="zoomOut">−</button><span id="zoomVal">×1.0</span><button id="zoomIn">+</button>
    </div>
    <button id="rotateBtn">Повернуть: горизонталь</button>
    <button id="shutter" aria-label="Снимок"></button>
  </div>
  <div id="toast"></div>
</div>
<div id="settings">
  <div class="back"></div>
  <div id="sheet">
    <h3>Куда сохранять файлы</h3>
    <p>Нажми на папку — выбор сохранится и будет действовать на все снимки.</p>
    <button class="fold" data-dir="DOWNLOADS">Загрузки <small>Download / SunCamera — самый надёжный вариант</small></button>
    <button class="fold" data-dir="DOCUMENTS">Документы <small>Documents / SunCamera</small></button>
    <button class="fold" data-dir="PICTURES">Изображения <small>Pictures / SunCamera</small></button>
    <button class="fold" data-dir="EXTERNAL_STORAGE">Вся память телефона <small>/storage/emulated/0/SunCamera</small></button>
    <button class="fold" data-dir="APP">Папка приложения <small>работает всегда, без разрешений системы</small></button>
    <button id="sheetClose">Готово</button>
  </div>
</div>
<script>
(function(){
  var FS = null, CAP_OK = false;
  try { FS = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem; CAP_OK = !!FS; } catch(e){}

  var video = document.getElementById('cam');
  var ui = document.getElementById('ui');
  var frameEl = document.getElementById('frame');
  var modeLabel = document.getElementById('modeLabel');
  var toast = document.getElementById('toast');
  var stream = null, facing = 'environment', zoom = 1.0, nativeZoom = false, cssZoom = 1.0;

  var MODE = 'work';               // 'story' | 'work'
  var workOrient = 'landscape';    // для режима работ
  var theme = localStorage.getItem('sc_theme') || 'dark';
  applyTheme();

  var DIRS = {
    DOWNLOADS:        { label:'Загрузки',           cap:'DOWNLOADS',        sub:'SunCamera', path:'Download/SunCamera' },
    DOCUMENTS:        { label:'Документы',          cap:'DOCUMENTS',        sub:'SunCamera', path:'Documents/SunCamera' },
    PICTURES:         { label:'Изображения',        cap:'PICTURES',         sub:'SunCamera', path:'Pictures/SunCamera' },
    EXTERNAL_STORAGE: { label:'Вся память телефона',cap:'EXTERNAL_STORAGE', sub:'SunCamera', path:'/storage/emulated/0/SunCamera' },
    APP:              { label:'Папка приложения',   cap:'DATA',             sub:'SunCamera', path:'Android/data/…/files/SunCamera' }
  };
  var chosenKey = localStorage.getItem('sc_dir') || 'DOWNLOADS';

  function applyTheme(){
    document.body.classList.toggle('light', theme==='light');
    document.getElementById('themeBtn').textContent = theme==='light' ? 'Тёмная' : 'Светлая';
  }
  document.getElementById('themeBtn').addEventListener('click', function(){
    theme = theme==='light' ? 'dark' : 'light'; localStorage.setItem('sc_theme', theme); applyTheme();
  });

  function toastMsg(t, ms){
    toast.textContent = t; toast.style.display='block';
    clearTimeout(toastMsg._t); toastMsg._t = setTimeout(function(){ toast.style.display='none'; }, ms||4200);
  }

  // ---------- размеры рамки ----------
  function calcFrame(){
    var W = window.innerWidth, H = window.innerHeight, w, h;
    if (MODE==='story'){
      // 9:16, почти во весь экран — поле сверху/снизу лишь для кнопок
      h = Math.min(H*0.86, (W*0.97)*16/9);
      w = h*9/16;
    } else {
      // 4:3
      if (workOrient==='landscape'){ w = Math.min(W*0.97, (H*0.62)*4/3); h = w*3/4; }
      else { h = Math.min(H*0.62, (W*0.97)*4/3); w = h*3/4; }
    }
    frameEl.style.width = w+'px'; frameEl.style.height = h+'px';
    modeLabel.style.top = (frameEl.getBoundingClientRect().top - 30) + 'px';
    modeLabel.textContent = MODE==='story'
      ? 'Сторис: кадр 1080×1920 + обложка 800×800'
      : 'Работа ' + (workOrient==='landscape' ? '1600×1200' : '1200×1600');
  }
  window.addEventListener('resize', calcFrame);

  // ---------- камера ----------
  async function startCam(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1080} }, audio:false });
    }catch(e){ toastMsg('Нет доступа к камере: '+e.message, 6000); return; }
    video.srcObject = stream;
    video.style.display='block'; ui.style.display='block';
    document.getElementById('start').style.display='none';
    setTimeout(calcFrame, 50);
  }
  document.getElementById('startBtn').addEventListener('click', startCam);

  document.getElementById('switchCam').addEventListener('click', async function(){
    facing = facing==='environment' ? 'user' : 'environment';
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); await startCam(); }
  });

  function setZoom(z){
    zoom = Math.max(1, Math.min(4, z));
    document.getElementById('zoomVal').textContent = '×' + zoom.toFixed(1);
    cssZoom = 1;
    var track = stream && stream.getVideoTracks()[0];
    if (track){
      try{
        track.applyConstraints({ advanced:[{ zoom: zoom }] });
        nativeZoom = true; return;
      }catch(e){}
    }
    nativeZoom = false; cssZoom = zoom;
    video.classList.add('scale');
    video.style.transform = 'scale(' + cssZoom + ')';
  }
  document.getElementById('zoomIn').addEventListener('click', function(){ setZoom(zoom+0.25); });
  document.getElementById('zoomOut').addEventListener('click', function(){ setZoom(zoom-0.25); });
  video.addEventListener('touchstart', function(e){ if (e.touches.length===2){ pinchStart = dist(e); zoomStart = zoom; } });
  video.addEventListener('touchmove', function(e){ if (e.touches.length===2){ setZoom(zoomStart * dist(e) / pinchStart); } });
  var pinchStart=0, zoomStart=1;
  function dist(e){ var a=e.touches[0], b=e.touches[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
  video.addEventListener('wheel', function(e){ setZoom(zoom + (e.deltaY<0?0.1:-0.1)); });

  // ---------- режимы ----------
  document.getElementById('mStory').addEventListener('click', function(){ MODE='story'; mark(); calcFrame(); });
  document.getElementById('mWork').addEventListener('click', function(){ MODE='work'; mark(); calcFrame(); });
  document.getElementById('rotateBtn').addEventListener('click', function(){
    workOrient = workOrient==='landscape' ? 'portrait' : 'landscape';
    this.textContent = workOrient==='landscape' ? 'Повернуть: горизонталь' : 'Повернуть: вертикаль';
    calcFrame();
  });
  function mark(){
    document.getElementById('mStory').classList.toggle('active', MODE==='story');
    document.getElementById('mWork').classList.toggle('active', MODE==='work');
    document.getElementById('rotateBtn').style.display = MODE==='work' ? 'block' : 'none';
  }

  // ---------- съёмка ----------
  function cropRect(){
    // прямоугольник кадра на экране -> координаты исходного видео
    var fr = frameEl.getBoundingClientRect();
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    // как видео легло на экран (object-fit: cover)
    var dw = window.innerWidth, dh = window.innerHeight;
    var scale = Math.max(dw/vw, dh/vh);
    var shownW = vw*scale*cssZoom, shownH = vh*scale*cssZoom;
    var offX = (dw - shownW)/2, offY = (dh - shownH)/2;
    var sx = (fr.left - offX) / (shownW/vw);
    var sy = (fr.top  - offY) / (shownH/vh);
    var sw = fr.width  / (shownW/vw);
    var sh = fr.height / (shownH/vh);
    sx = Math.max(0, Math.min(vw-sw, sx)); sy = Math.max(0, Math.min(vh-sh, sy));
    return { x:sx, y:sy, w:sw, h:sh };
  }

  function saveBlob(blob, base, isJpgDone){
    // расширение в имени: база .jpg, нумерация продолжается
    resolveAndSave(blob, base).then(function(){ if (isJpgDone) isJpgDone(); }).catch(function(err){
      toastMsg('Не удалось сохранить: ' + (err&&err.message||err), 5000);
    });
  }

  async function nextName(dirInfo, base){
    var names = [];
    try { var ls = await FS.readdir({ directory: dirInfo.cap, path: dirInfo.sub }); names = ls.files.map(function(f){return f.name;}); } catch(e){}
    var max = 1, rx = new RegExp('^'+base+'(__(\\d+))?\\.jpg$');
    names.forEach(function(n){ var m = n.match(rx); if (m){ if (m[2]) max = Math.max(max, parseInt(m[2],10)+1); else max = Math.max(max,2); } });
    return max===1 ? base : base+'__'+max;
  }

  async function ensureDir(dirInfo){
    try { await FS.mkdir({ directory: dirInfo.cap, path: dirInfo.sub, recursive:true }); } catch(e){}
  }

  async function write(dirInfo, name, blob){
    var data = await blobToBase64(blob);
    await ensureDir(dirInfo);
    await FS.writeFile({ directory: dirInfo.cap, path: dirInfo.sub+'/'+name, data: data, recursive:true });
  }

  function blobToBase64(blob){
    return new Promise(function(res, rej){
      var r = new FileReader(); r.onload = function(){ res(r.result.split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob);
    });
  }

  async function resolveAndSave(blob, base){
    var chain = [chosenKey, 'DOWNLOADS', 'APP'].filter(function(v,i,a){ return a.indexOf(v)===i; });
    var lastErr = null;
    for (var i=0;i<chain.length;i++){
      var d = DIRS[chain[i]];
      try{
        var name = await nextName(d, base);
        await write(d, name, blob);
        var where = d.label;
        toastMsg('Сохранено: ' + where + (d.sub? ' / '+d.sub : '') + ' → ' + name);
        return;
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('нет доступа к папке');
  }

  function canvasBlob(cv){
    return new Promise(function(res){ cv.toBlob(function(b){ res(b); }, 'image/jpeg', 0.92); });
  }

  document.getElementById('shutter').addEventListener('click', async function(){
    if (!video.videoWidth){ toastMsg('Камера ещё не готова'); return; }
    var r = cropRect(); if (!r){ toastMsg('Камера ещё не готова'); return; }
    var btn = this; btn.disabled = true;

    // оригинал: полный кадр камеры как есть
    var ov = document.createElement('canvas');
    ov.width = video.videoWidth; ov.height = video.videoHeight;
    ov.getContext('2d').drawImage(video, 0, 0, ov.width, ov.height);
    var ob = await canvasBlob(ov);

    // стандартный кадр из рамки
    var cv = document.createElement('canvas');
    if (MODE==='story'){
      cv.width = 1080; cv.height = 1920;
    } else {
      cv.width = workOrient==='landscape' ? 1600 : 1200;
      cv.height = workOrient==='landscape' ? 1200 : 1600;
    }
    cv.getContext('2d').drawImage(video, r.x, r.y, r.w, r.h, 0, 0, cv.width, cv.height);
    var cb = await canvasBlob(cv);

    if (MODE==='story'){
      var obq = ob, cbq = cb;
      if (ob) await resolveAndSave(ob, 'original_ctoris_kadr').catch(function(){});
      if (cb){
        await resolveAndSave(cb, 'kadr_storis').catch(function(){});
        // обложка 800x800 — центральная часть кадра сторис
        var sq = document.createElement('canvas'); sq.width=800; sq.height=800;
        var side = Math.min(cv.width, cv.height);
        sq.getContext('2d').drawImage(cv, (cv.width-side)/2, (cv.height-side)/2, side, side, 0, 0, 800, 800);
        var sb = await canvasBlob(sq);
        if (sb) await resolveAndSave(sb, 'oblojka_storis').catch(function(){});
      }
    } else {
      if (cb) await resolveAndSave(cb, 'raboti').catch(function(){});
      if (ob) await resolveAndSave(ob, 'original_raboti').catch(function(){});
    }
    btn.disabled = false;
  });

  // ---------- настройки: список папок ----------
  var settingsEl = document.getElementById('settings');
  document.getElementById('settingsBtn').addEventListener('click', function(){ renderDirs(); settingsEl.style.display='block'; });
  document.getElementById('sheetClose').addEventListener('click', function(){ settingsEl.style.display='none'; });
  settingsEl.querySelector('.back').addEventListener('click', function(){ settingsEl.style.display='none'; });

  function renderDirs(){
    settingsEl.querySelectorAll('.fold').forEach(function(btn){
      var k = btn.getAttribute('data-dir');
      btn.classList.toggle('sel', k===chosenKey);
      btn.onclick = async function(){
        var d = DIRS[k];
        var ok = true;
        if (CAP_OK){
          try { await ensureDir(d); await FS.writeFile({ directory:d.cap, path:d.sub+'/.sc_test', data:'ok' }); }
          catch(e){ ok = false; }
        }
        if (ok){
          chosenKey = k; localStorage.setItem('sc_dir', k);
          renderDirs();
          toastMsg('Папка выбрана: ' + d.label + (d.sub? ' / '+d.sub : ''));
          settingsEl.style.display='none';
        } else {
          btn.classList.add('sel'); btn.textContent = d.label + ' — недоступно системой';
          setTimeout(function(){ btn.innerHTML = d.label + '<small>' + (btn._sm || d.path) + '</small>'; }, 2500);
        }
      };
      btn._sm = d.path;
      if (!CAP_OK){ var s = btn.querySelector('small'); if (s) s.textContent = 'нет доступа к файловой системе (браузер)'; }
    });
  }

  mark(); calcFrame();
})();
</script>
</body>
</html>
