<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sun Camera</title>
<style>
  :root { --peach:#f7b79a; --teal:#59d3c0; --blue:#7cc4ff; --bg:#141414; --panel:#2a2622; --text:#fff; }
  body.light { --bg:#f4efe9; --panel:#fff; --text:#222; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center; }
  .frame { position:fixed; box-sizing:border-box; border:3px solid var(--peach); border-radius:14px;
    pointer-events:none; display:none; }
  #coverFrame { border:3px dashed var(--teal); border-radius:10px; }
  #workFrame { border-color:var(--blue); }
  .pill { position:fixed; background:rgba(0,0,0,.45); color:#fff; border:none; border-radius:22px;
    padding:10px 16px; font-size:15px; z-index:20; }
  body.light .pill { background:rgba(255,255,255,.75); color:#222; }
  #menuBtn { top:10px; left:10px; font-size:16px; }
  #statusLine { position:fixed; top:60px; left:12px; font-size:13px; z-index:15;
    color:#fff; text-shadow:0 1px 3px #000; }
  body.light #statusLine { color:#222; text-shadow:0 1px 3px #fff; }
  #menu { position:fixed; top:56px; left:10px; background:var(--panel); border-radius:14px;
    padding:6px; display:flex; flex-direction:column; gap:2px; z-index:40; min-width:200px;
    box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #menu.hidden { display:none; }
  #menu button { background:none; border:none; color:var(--text); text-align:left; font-size:16px;
    padding:13px 14px; border-radius:10px; }
  #menu button:active { background:rgba(127,127,127,.25); }
  #shutter { position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    width:72px; height:72px; border-radius:50%; background:var(--peach); border:4px solid #fff; z-index:30; }
  #zoomOut { bottom:118px; left:calc(50% - 62px); width:50px; }
  #zoomIn  { bottom:118px; left:calc(50% + 12px); width:50px; }
  #zoomLbl { position:fixed; bottom:158px; left:50%; transform:translateX(-50%);
    font-size:14px; z-index:20; color:#fff; text-shadow:0 1px 3px #000; }
  body.light #zoomLbl { color:#222; text-shadow:0 1px 3px #fff; }
  #rotateBtn { bottom:118px; left:12px; }
  #sheet { position:fixed; left:0; right:0; bottom:0; background:var(--panel); color:var(--text);
    border-radius:18px 18px 0 0; padding:16px 18px 34px; z-index:60; transform:translateY(105%);
    transition:transform .25s; box-shadow:0 -8px 40px rgba(0,0,0,.5); }
  #sheet.open { transform:translateY(0); }
  #sheet h3 { margin:0 0 4px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  #sheet h3 button { background:none; border:none; color:var(--text); font-size:20px; padding:4px 8px; }
  .row-label { font-size:13px; opacity:.7; margin-top:10px; }
  #curFolder { font-size:14px; margin-top:4px; word-break:break-all; }
  .pick { display:block; width:100%; padding:15px; border-radius:12px; margin-top:10px;
    border:1px solid rgba(127,127,127,.4); background:rgba(127,127,127,.12);
    color:var(--text); font-size:16px; text-align:left; }
  .hint { font-size:12px; opacity:.65; margin-top:10px; line-height:1.5; }
  #toast { position:fixed; bottom:196px; left:12px; right:12px; background:rgba(30,20,15,.92);
    color:#fff; border-radius:12px; padding:12px 14px; font-size:14px; z-index:70; opacity:0;
    transition:opacity .25s; pointer-events:none; white-space:pre-line; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div class="frame" id="storyFrame"></div>
<div class="frame" id="coverFrame"></div>
<div class="frame" id="workFrame"></div>

<button class="pill" id="menuBtn">☰ Меню</button>
<div id="statusLine"></div>
<div id="menu" class="hidden">
  <button data-act="story">Сторис</button>
  <button data-act="work">Работы</button>
  <button data-act="flip">Камера ⇄</button>
  <button data-act="theme">Светлая тема</button>
  <button data-act="settings">⚙ Настройки</button>
</div>

<button class="pill" id="rotateBtn">Повернуть: вертикаль</button>
<button class="pill" id="zoomOut">−</button>
<button class="pill" id="zoomIn">+</button>
<div id="zoomLbl">x1.0</div>
<button id="shutter" aria-label="Снимок"></button>

<div id="sheet">
  <h3>Настройки <button id="sheetClose">✕</button></h3>
  <div class="row-label">Папка сохранения</div>
  <div id="curFolder"></div>
  <button class="pick" id="pickBtn">📁 Выбрать папку через проводник…</button>
  <button class="pick" id="resetBtn">↩ Сбросить: сохранять в память приложения</button>
  <p class="hint">Проводник откроется как обычный файловый менеджер: листаешь дерево
каталогов, выбираешь любую папку (например, Загрузки или Pictures) — все фото
будут падать прямо в неё, без создания лишних подпапок.</p>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const video = $('video');
const SP = () => (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.SafPicker) ? Capacitor.Plugins.SafPicker : null;

let mode='story', orient='vertical', facing='environment', light=false;
let zoom=1, panX=0, panY=0;
let rects={story:null, cover:null, work:null};
let stream=null;

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.style.opacity=1;
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity=0;},3800);
}

/* ---------- камера ---------- */
async function ensureCamera(){
  try {
    if (stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode: facing, width:{ideal:1920}, height:{ideal:1080} }, audio:false });
    video.srcObject = stream;
    await video.play().catch(()=>{});
  } catch(e){ toast('Нет доступа к камере: ' + (e.message||e)); }
}

/* фикс зависаний после возврата из другого приложения */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) ensureCamera(); });
window.addEventListener('focus', ensureCamera);
window.addEventListener('pageshow', ()=>ensureCamera());

/* ---------- геометрия рамок ---------- */
function layout(){
  const vw=innerWidth, vh=innerHeight;
  const topSafe=112, bottomSafe=172, m=10;
  const availH=vh-topSafe-bottomSafe, availW=vw-2*m;
  let s={x:0,y:0,w:0,h:0};
  if (mode==='story'){
    if (orient==='vertical'){
      let h=Math.min(availH*0.8, availW*16/9), w=h*9/16;
      if (w>availW){ w=availW; h=w*16/9; }
      s={x:(vw-w)/2, y:topSafe+(availH-h)/2, w:w, h:h};
      const ch=s.w*800/1080, cw=s.w;
      rects.cover={x:s.x, y:s.y+(s.h-ch)/2, w:cw, h:ch};
    } else {
      let w=Math.min(availW*0.92, availH*16/9), h=w*9/16;
      if (h>availH){ h=availH; w=h*16/9; }
      s={x:(vw-w)/2, y:topSafe+(availH-h)/2, w:w, h:h};
      const ch=s.h, cw=Math.min(s.w, ch*1080/800);
      rects.cover={x:s.x+(s.w-cw)/2, y:s.y, w:cw, h:ch};
    }
    rects.work=null;
    place($('storyFrame'), s); place($('coverFrame'), rects.cover); place($('workFrame'), null);
    $('rotateBtn').style.display='block';
    $('statusLine').textContent='Сторис: кадр 1080×1920 + обложка 1080×800';
  } else {
    let h=availH*0.62, w=h*4/3;
    if (w>availW){ w=availW; h=w*3/4; }
    s={x:(vw-w)/2, y:topSafe+(availH-h)/2, w:w, h:h};
    rects.work=s; rects.story=null; rects.cover=null;
    place($('workFrame'), s); place($('storyFrame'), null); place($('coverFrame'), null);
    $('rotateBtn').style.display='none';
    $('statusLine').textContent='Работы: 1600×1200';
  }
}
function place(el, r){
  if (!r){ el.style.display='none'; return; }
  el.style.display='block';
  el.style.left=r.x+'px'; el.style.top=r.y+'px';
  el.style.width=r.w+'px'; el.style.height=r.h+'px';
}

/* ---------- съёмка ---------- */
function captureRect(rect,outW,outH){
  const vw=innerWidth, vh=innerHeight;
  const w0=video.videoWidth||1280, h0=video.videoHeight||720;
  const fit=Math.max(vw/w0, vh/h0);
  const dispW=w0*fit*zoom, dispH=h0*fit*zoom;
  const left=(vw-dispW)/2+panX, top=(vh-dispH)/2+panY;
  const sx=(rect.x-left)*w0/dispW, sy=(rect.y-top)*h0/dispH;
  const sw=rect.w*w0/dispW, sh=rect.h*h0/dispH;
  const c=document.createElement('canvas'); c.width=outW; c.height=outH;
  c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0,0,outW,outH);
  return c.toDataURL('image/jpeg',0.92);
}
function nextName(base, names){
  let max=0;
  for (const n of names){
    if (!n || !n.toLowerCase().endsWith('.jpg')) continue;
    const stem=n.slice(0,-4);
    let m=null;
    if (stem===base) m=1;
    else { const mm=stem.match(new RegExp('^'+base+'__(\\d+)$')); if (mm) m=parseInt(mm[1],10); }
    if (m) max=Math.max(max,m);
  }
  return max===0 ? base : base+'__'+(max+1);
}
async function listNames(){
  const uri=localStorage.getItem('saveUri'), sp=SP();
  if (uri && sp){ try{ const r=await sp.listFiles({uri:uri}); return (r&&r.names)||[]; }catch(e){} }
  if (window.Capacitor && Capacitor.Plugins.Filesystem){
    try{ const r=await Capacitor.Plugins.Filesystem.readdir({path:'SunCamera', directory:'EXTERNAL'});
      return r.files.map(f=>f.name); }catch(e){}
  }
  return [];
}
async function saveJpg(name, dataUrl){
  const b64=dataUrl.split(',')[1];
  const uri=localStorage.getItem('saveUri'), sp=SP();
  if (uri && sp){
    try{
      const r=await sp.saveFile({uri:uri, name:name+'.jpg', data:b64});
      return (localStorage.getItem('saveLabel')||'выбранная папка')+' / '+(r.name||name+'.jpg');
    }catch(e){ /* идём в запасной вариант */ }
  }
  if (window.Capacitor && Capacitor.Plugins.Filesystem){
    try{
      await Capacitor.Plugins.Filesystem.writeFile(
        {path:'SunCamera/'+name+'.jpg', data:b64, directory:'EXTERNAL'});
      return 'память приложения / SunCamera / '+name+'.jpg';
    }catch(e){}
  }
  const a=document.createElement('a'); a.href=dataUrl; a.download=name+'.jpg'; a.click();
  return 'скачано: '+name+'.jpg';
}
async function shoot(){
  if (!video.videoWidth){ toast('Камера ещё не готова, подожди секунду'); return; }
  $('shutter').disabled=true;
  try{
    const names=await listNames();
    const k=1920/Math.max(innerWidth,innerHeight);
    const ow=Math.round(innerWidth*k), oh=Math.round(innerHeight*k);
    let group;
    if (mode==='story'){
      const n=Math.max(nextNum('oblojka_storis',names), nextNum('kadr_storis',names), nextNum('original_storis',names));
      const tag=(x)=> x===1 ? '' : '__'+x;
      group=[
        ['oblojka_storis'+tag(n), captureRect(rects.cover,1080,800)],
        ['kadr_storis'+tag(n),     captureRect(rects.story,1080,1920)],
        ['original_storis'+tag(n), captureRect({x:0,y:0,w:innerWidth,h:innerHeight},ow,oh)]
      ];
    } else {
      const n=Math.max(nextNum('kadr_rabot',names), nextNum('original_rabot',names));
      const tag=(x)=> x===1 ? '' : '__'+x;
      group=[
        ['kadr_rabot'+tag(n),      captureRect(rects.work,1600,1200)],
        ['original_rabot'+tag(n),  captureRect({x:0,y:0,w:innerWidth,h:innerHeight},ow,oh)]
      ];
    }
    const saved=[];
    for (const [name,data] of group) saved.push(await saveJpg(name,data));
    toast('Сохранено:\n'+saved.join('\n'));
  } catch(e){ toast('Ошибка: '+(e.message||e)); }
  $('shutter').disabled=false;
}
function nextNum(base,names){
  let max=0;
  for (const nm of names){
    if (!nm||!nm.toLowerCase().endsWith('.jpg')) continue;
    const stem=nm.slice(0,-4);
    let m=null;
    if (stem===base) m=1;
    else { const mm=stem.match(new RegExp('^'+base+'__(\\d+)$')); if (mm) m=parseInt(mm[1],10); }
    if (m) max=Math.max(max,m);
  }
  return max+1;
}

/* ---------- меню ---------- */
function showMenu(){ $('menu').classList.remove('hidden'); }
function hideMenu(){ $('menu').classList.add('hidden'); }
$('menuBtn').addEventListener('click', e=>{ e.stopPropagation();
  $('menu').classList.toggle('hidden'); });
document.addEventListener('click', e=>{
  if (!$('menu').classList.contains('hidden') && !$('menu').contains(e.target)) hideMenu();
});
$('menu').addEventListener('click', e=>{
  const act=e.target.dataset.act; if (!act) return;
  hideMenu();
  if (act==='story'||act==='work'){ mode=act; layout(); }
  else if (act==='flip'){ facing = facing==='environment' ? 'user' : 'environment'; ensureCamera(); }
  else if (act==='theme'){ light=!light; document.body.classList.toggle('light',light);
    e.target.textContent = light ? 'Тёмная тема' : 'Светлая тема'; }
  else if (act==='settings'){ openSheet(); }
});

/* ---------- настройки / выбор папки ---------- */
function openSheet(){ updateFolderLine(); $('sheet').classList.add('open'); }
function closeSheet(){ $('sheet').classList.remove('open'); }
$('sheetClose').addEventListener('click', closeSheet);
function updateFolderLine(){
  const lbl=localStorage.getItem('saveLabel');
  $('curFolder').textContent = lbl ? ('📁 '+lbl) : 'не выбрана — сейчас сохраняется в память приложения';
}
$('pickBtn').addEventListener('click', async ()=>{
  const sp=SP();
  if (!sp){ toast('Выбор папки работает в приложении на Android'); return; }
  try{
    const r=await sp.pickFolder();
    if (!r || r.canceled) return;
    localStorage.setItem('saveUri', r.uri);
    localStorage.setItem('saveLabel', r.label || 'выбранная папка');
    updateFolderLine();
    toast('Папка сохранения: '+(r.label||r.uri));
    closeSheet();
  } catch(e){ toast('Не удалось открыть проводник: '+(e.message||e)); }
});
$('resetBtn').addEventListener('click', ()=>{
  localStorage.removeItem('saveUri'); localStorage.removeItem('saveLabel');
  updateFolderLine(); toast('Файлы будут сохраняться в память приложения');
});

/* ---------- зум, пан, поворот ---------- */
function clampPan(){
  const vw=innerWidth, vh=innerHeight;
  const w0=video.videoWidth||1280, h0=video.videoHeight||720;
  const fit=Math.max(vw/w0,vh/h0);
  const dispW=w0*fit*zoom, dispH=h0*fit*zoom;
  panX=Math.max(-(dispW-vw)/2, Math.min((dispW-vw)/2, panX));
  panY=Math.max(-(dispH-vh)/2, Math.min((dispH-vh)/2, panY));
}
function applyTransform(){
  clampPan();
  video.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  $('zoomLbl').textContent='x'+zoom.toFixed(1);
}
$('zoomIn').addEventListener('click', ()=>{ zoom=Math.min(3,+(zoom+0.2).toFixed(1)); applyTransform(); });
$('zoomOut').addEventListener('click', ()=>{ zoom=Math.max(1,+(zoom-0.2).toFixed(1)); applyTransform(); });
$('rotateBtn').addEventListener('click', ()=>{
  orient = orient==='vertical' ? 'horizontal' : 'vertical';
  $('rotateBtn').textContent='Повернуть: '+(orient==='vertical'?'вертикаль':'горизонталь');
  layout();
});
let pinch=null, drag=null;
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
video.addEventListener('touchstart', e=>{
  if (e.touches.length===2){ pinch={d:dist(e), z:zoom}; drag=null; }
  else if (e.touches.length===1){ drag={x:e.touches[0].clientX,y:e.touches[0].clientY,px:panX,py:panY}; pinch=null; }
},{passive:true});
video.addEventListener('touchmove', e=>{
  if (pinch && e.touches.length===2){ zoom=Math.max(1,Math.min(3, pinch.z*dist(e)/pinch.d)); applyTransform(); }
  else if (drag && e.touches.length===1){ panX=drag.px+(e.touches[0].clientX-drag.x); panY=drag.py+(e.touches[0].clientY-drag.y); applyTransform(); }
},{passive:true});
video.addEventListener('touchend', ()=>{ pinch=null; drag=null; },{passive:true});

$('shutter').addEventListener('click', shoot);
window.addEventListener('resize', layout);

/* ---------- старт ---------- */
layout();
ensureCamera();
setTimeout(()=>{
  if (!localStorage.getItem('saveUri'))
    toast('Выбери папку сохранения: ☰ Меню → ⚙ Настройки → «Выбрать папку…»');
}, 1500);
})();
</script>
</body>
</html>
