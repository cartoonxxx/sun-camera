<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sun Camera</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1a1a; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  body.light { background:#f4f4f4; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; transition:transform .15s; }
  .pill { border:none; border-radius:22px; padding:11px 18px; font-size:15px; font-weight:600;
          background:rgba(30,30,30,.82); color:#fff; }
  body.light .pill { background:rgba(255,255,255,.92); color:#222; }
  #topbar { position:fixed; top:10px; left:10px; right:10px; z-index:30; display:flex; align-items:flex-start; }
  #menuBtn { z-index:32; }
  #menu { position:absolute; top:50px; left:0; min-width:210px; background:rgba(30,30,30,.95);
          border-radius:16px; padding:8px; display:flex; flex-direction:column; gap:4px; z-index:33;
          box-shadow:0 8px 30px rgba(0,0,0,.5); }
  body.light #menu { background:rgba(255,255,255,.97); }
  #menu button { text-align:left; border:none; background:transparent; color:#eee; font-size:16px;
                 padding:12px 14px; border-radius:12px; }
  body.light #menu button { color:#222; }
  #menu button:active { background:rgba(255,255,255,.12); }
  body.light #menu button:active { background:rgba(0,0,0,.08); }
  #menu.hidden { display:none; }

  .frame { position:fixed; z-index:10; pointer-events:none; }
  #storiesFrame { border:3px solid #f2a48c; border-radius:22px; }
  #coverFrame { border:3px dashed #4ecdc4; border-radius:14px; }
  #worksFrame { border:3px solid #f2a48c; border-radius:22px; }

  #zoomLabel { position:fixed; right:14px; bottom:250px; z-index:20; color:#fff; font-size:13px;
               font-weight:700; background:rgba(20,20,20,.55); padding:5px 10px; border-radius:10px; }

  #bottombar { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; flex-direction:column;
               align-items:center; gap:10px; padding:8px 0 26px; }
  #zoomRow { display:flex; gap:14px; }
  #zoomRow button { width:52px; height:44px; border-radius:14px; font-size:22px; }
  #controlsRow { display:flex; align-items:center; gap:22px; }
  #shutter { width:74px; height:74px; border-radius:50%; border:4px solid #fff;
             background:#f2a48c; box-shadow:0 0 18px rgba(0,0,0,.4); }
  #rotateBtn { display:none; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60; transition:opacity .25s; }

  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:50; background:#262626;
           border-radius:22px 22px 0 0; padding:20px 18px 30px; transform:translateY(105%);
           transition:transform .25s; max-height:75%; overflow-y:auto; }
  body.light #sheet { background:#fff; }
  #sheet.open { transform:translateY(0); }
  #sheet h3 { color:#fff; margin-bottom:14px; }
  body.light #sheet h3 { color:#222; }
  #curFolder { color:#aaa; font-size:13px; line-height:1.45; margin-bottom:14px; word-break:break-all; }
  #sheet button.wide { width:100%; text-align:left; margin-bottom:8px; font-size:16px; }
  #toast { position:fixed; left:14px; right:14px; bottom:120px; z-index:70; background:#2c2c2c; color:#fff;
           padding:13px 16px; border-radius:14px; font-size:14px; opacity:0; transition:opacity .3s;
           text-align:center; pointer-events:none; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="flash"></div>

<div id="topbar">
  <button id="menuBtn" class="pill">&#9776; Меню</button>
  <div id="menu" class="hidden">
    <button data-act="stories">&#128247; Сторис</button>
    <button data-act="works">&#128188; Работы</button>
    <button data-act="switchcam">&#8646; Камера</button>
    <button data-act="theme">&#127774; Светлая тема</button>
    <button data-act="settings">&#9881; Настройки</button>
  </div>
</div>

<div id="storiesFrame" class="frame"></div>
<div id="coverFrame" class="frame"></div>
<div id="worksFrame" class="frame" style="display:none"></div>
<div id="zoomLabel">x1.0</div>

<div id="bottombar">
  <div id="zoomRow">
    <button id="zoomOut" class="pill">&minus;</button>
    <button id="zoomIn" class="pill">+</button>
  </div>
  <div id="controlsRow">
    <button id="rotateBtn" class="pill">&#8646; Повернуть</button>
    <button id="shutter"></button>
  </div>
</div>

<div id="sheet">
  <h3>Настройки</h3>
  <div id="curFolder">Папка сохранения: по умолчанию (Документы / SunCamera)</div>
  <button id="pickFolderBtn" class="pill wide">&#128193; Выбрать папку через проводник&hellip;</button>
  <button id="resetFolderBtn" class="pill wide">&#8634; Сбросить папку</button>
  <button id="closeSettings" class="pill wide">Закрыть</button>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var video = $('cam');

  var state = { mode:'stories', facing:'environment', zoom:1, worksLandscape:true, saf:null };
  try {
    var savedTheme = localStorage.getItem('suncam_theme');
    if (savedTheme === 'light') document.body.classList.add('light');
  } catch(e){}

  function isNative(){
    try { return window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform(); }
    catch(e){ return false; }
  }
  function plugin(){
    if (!isNative()) return null;
    try { return Capacitor.Plugins.SafPicker || null; } catch(e){ return null; }
  }
  function fsPlugin(){
    if (!isNative()) return null;
    try { return Capacitor.Plugins.Filesystem || null; } catch(e){ return null; }
  }

  var toastTimer = null;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.style.opacity = 0; }, 3500);
  }

  /* ---------- камера ---------- */
  var stream = null;
  function stopStream(){
    if (stream) { try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} stream = null; }
    video.srcObject = null;
  }
  function startStream(){
    stopStream();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { return; }
    navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode: state.facing, width:{ideal:1920}, height:{ideal:1080} }
    }).then(function(s){
      stream = s; video.srcObject = s;
      return video.play();
    }).catch(function(err){
      toast('Нет доступа к камере: ' + (err && err.message ? err.message : err));
    });
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) setTimeout(startStream, 250);
  });
  window.addEventListener('focus', function(){ setTimeout(startStream, 250); });

  /* ---------- рамки ---------- */
  function layout(){
    var W = window.innerWidth, H = window.innerHeight;
    var top = 64, bottom = 178;
    var availH = H - top - bottom;
    if (availH < 100) availH = 100;
    var sf = $('storiesFrame'), cv = $('coverFrame'), wf = $('worksFrame');
    if (state.mode === 'stories') {
      wf.style.display = 'none';
      sf.style.display = 'block'; cv.style.display = 'block';
      var h = availH, w = h * 9 / 16;
      var maxW = W * 0.97;
      if (w > maxW) { w = maxW; h = w * 16 / 9; }
      var ft = top + (availH - h) / 2, fl = (W - w) / 2;
      sf.style.width = w + 'px'; sf.style.height = h + 'px';
      sf.style.left = fl + 'px'; sf.style.top = ft + 'px';
      var ch = w * 800 / 1080;
      cv.style.width = w + 'px'; cv.style.height = ch + 'px';
      cv.style.left = fl + 'px'; cv.style.top = (ft + (h - ch) / 2) + 'px';
    } else {
      sf.style.display = 'none'; cv.style.display = 'none';
      wf.style.display = 'block';
      var w2, h2;
      if (state.worksLandscape) {
        w2 = W * 0.97;
        if (w2 / (4/3) > availH) { h2 = availH; w2 = h2 * 4 / 3; } else { h2 = w2 * 3 / 4; }
      } else {
        h2 = availH * 0.96;
        w2 = h2 * 3 / 4;
        if (w2 > W * 0.97) { w2 = W * 0.97; h2 = w2 * 4 / 3; }
      }
      wf.style.width = w2 + 'px'; wf.style.height = h2 + 'px';
      wf.style.left = ((W - w2) / 2) + 'px';
      wf.style.top = (top + (availH - h2) / 2) + 'px';
    }
    $('rotateBtn').style.display = (state.mode === 'works') ? 'inline-block' : 'none';
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 300); });

  /* ---------- меню ---------- */
  var menu = $('menu');
  $('menuBtn').addEventListener('click', function(e){ e.stopPropagation(); menu.classList.toggle('hidden'); });
  menu.addEventListener('click', function(e){
    e.stopPropagation();
    var act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
    if (!act) return;
    menu.classList.add('hidden');
    if (act === 'stories') { state.mode = 'stories'; layout(); }
    else if (act === 'works') { state.mode = 'works'; layout(); }
    else if (act === 'switchcam') { state.facing = (state.facing === 'environment') ? 'user' : 'environment'; startStream(); }
    else if (act === 'theme') {
      document.body.classList.toggle('light');
      try { localStorage.setItem('suncam_theme', document.body.classList.contains('light') ? 'light' : 'dark'); } catch(e2){}
    }
    else if (act === 'settings') openSheet();
  });
  document.addEventListener('click', function(){ menu.classList.add('hidden'); });

  /* ---------- зум и поворот ---------- */
  function applyZoom(){
    video.style.transform = 'scale(' + state.zoom + ')';
    $('zoomLabel').textContent = 'x' + state.zoom.toFixed(1);
  }
  $('zoomIn').addEventListener('click', function(){ if (state.zoom < 8) { state.zoom = Math.round(state.zoom*10*1.25)/10; applyZoom(); } });
  $('zoomOut').addEventListener('click', function(){ if (state.zoom > 1) { state.zoom = Math.round(state.zoom*10/1.25)/10; if (state.zoom < 1) state.zoom = 1; applyZoom(); } });
  $('rotateBtn').addEventListener('click', function(){ state.worksLandscape = !state.worksLandscape; layout(); });

  /* ---------- настройки ---------- */
  var sheet = $('sheet');
  function openSheet(){ updateFolderLabel(); sheet.classList.add('open'); }
  function closeSheet(){ sheet.classList.remove('open'); }
  $('closeSettings').addEventListener('click', closeSheet);

  function folderLabel(uri){
    if (!uri) return 'Папка сохранения: по умолчанию (Документы / SunCamera)';
    var tail = uri;
    try {
      var m = uri.match(/tree\/primary%3A(.*)$/);
      if (m) tail = 'Память телефона / ' + decodeURIComponent(m[1]).replace(/\//g, ' / ');
    } catch(e){}
    return 'Папка сохранения: ' + tail;
  }
  function updateFolderLabel(){ $('curFolder').textContent = folderLabel(state.saf); }

  $('pickFolderBtn').addEventListener('click', function(){
    var p = plugin();
    if (!p) {
      toast(isNative() ? 'Плагин проводника не найден — переустановите приложение' :
                         'Проводник доступен только в приложении Sun Camera');
      return;
    }
    p.pickFolder().then(function(r){
      if (r && r.uri) {
        state.saf = r.uri;
        try { localStorage.setItem('suncam_saf', r.uri); } catch(e){}
        updateFolderLabel(); closeSheet();
        toast('Папка выбрана');
      }
      setTimeout(startStream, 250);
    }).catch(function(err){
      toast('Выбор папки: ' + (err && err.message ? err.message : err));
      setTimeout(startStream, 250);
    });
  });

  $('resetFolderBtn').addEventListener('click', function(){
    state.saf = null;
    try { localStorage.removeItem('suncam_saf'); } catch(e){}
    var p = plugin();
    if (p) { p.clearFolder().catch(function(){}); }
    updateFolderLabel();
    toast('Возврат к папке по умолчанию');
  });

  /* ---------- сохранение ---------- */
  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){ resolve(String(fr.result)); };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }
  function canvasToBlob(canvas){
    return new Promise(function(resolve, reject){
      canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error('toBlob error')); }, 'image/jpeg', 0.92);
    });
  }

  function nextNumber(names, prefix){
    var max = 1;
    for (var i = 0; i < names.length; i++) {
      var m = String(names[i]).match(new RegExp('^' + prefix + '(?:__(\\d+))?\\.jpe?g$', 'i'));
      if (m) { var n = m[1] ? parseInt(m[1], 10) : 1; if (n >= max) max = n + 1; }
    }
    return max;
  }

  function listExistingNames(){
    if (state.saf) {
      var p = plugin();
      if (p) { return p.listFiles().then(function(r){ return r && r.files ? r.files : []; }).catch(function(){ return []; }); }
      return Promise.resolve([]);
    }
    var fs = fsPlugin();
    if (fs) {
      return fs.readdir({ path:'SunCamera', directory:'DOCUMENTS' })
        .then(function(r){ return (r && r.files ? r.files : []).map(function(f){ return f.name; }); })
        .catch(function(){ return []; });
    }
    return Promise.resolve([]);
  }

  function saveFile(name, blob){
    return blobToBase64(blob).then(function(b64){
      if (state.saf) {
        var p = plugin();
        if (p) { return p.saveFile({ name:name, base64:b64 }); }
      }
      var fs = fsPlugin();
      if (fs) {
        return fs.mkdir({ path:'SunCamera', directory:'DOCUMENTS', recursive:true }).catch(function(){})
          .then(function(){
            return fs.writeFile({ path:'SunCamera/' + name, directory:'DOCUMENTS', data:b64 });
          });
      }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      return { web:true };
    });
  }

  function cropRect(el){
    var r = el.getBoundingClientRect();
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    var sw = window.innerWidth, sh = window.innerHeight;
    var cover = Math.max(sw / vw, sh / vh);
    var scale = cover * state.zoom;
    var ox = (sw - vw * scale) / 2, oy = (sh - vh * scale) / 2;
    return { x:(r.left - ox) / scale, y:(r.top - oy) / scale, w:r.width / scale, h:r.height / scale };
  }
  function rectCanvas(rect){
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(rect.w));
    c.height = Math.max(1, Math.round(rect.h));
    c.getContext('2d').drawImage(video, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    return c;
  }
  function fullCanvas(){
    var c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    return c;
  }
  function flashFx(){
    var f = $('flash');
    f.style.opacity = 0.85;
    setTimeout(function(){ f.style.opacity = 0; }, 120);
  }

  function shoot(){
    if (!stream || !video.videoWidth) { toast('Камера недоступна'); return; }
    flashFx();
    var prefixes = state.mode === 'stories'
      ? { kadr:'kadr_storis', cover:'oblojka_storis', orig:'original_kadr' }
      : { kadr:'kadr_raboty', cover:null, orig:'original_raboty' };
    var frameEl = state.mode === 'stories' ? $('storiesFrame') : $('worksFrame');
    var coverEl = state.mode === 'stories' ? $('coverFrame') : null;
    listExistingNames().then(function(names){
      var n = nextNumber(names, prefixes.kadr);
      var suffix = n > 1 ? '__' + n : '';
      var jobs = [];
      try {
        jobs.push(saveFile(prefixes.kadr + suffix + '.jpg', canvasToBlob(rectCanvas(cropRect(frameEl)))));
        if (coverEl) jobs.push(saveFile(prefixes.cover + suffix + '.jpg', canvasToBlob(rectCanvas(cropRect(coverEl)))));
        jobs.push(saveFile(prefixes.orig + suffix + '.jpg', canvasToBlob(fullCanvas())));
      } catch(e) { toast('Ошибка съёмки: ' + e.message); return; }
      Promise.all(jobs).then(function(){
        toast('Сохранено: ' + prefixes.kadr + suffix + '.jpg' + (prefixes.cover ? ' + обложка + оригинал' : ' + оригинал'));
      }).catch(function(err){
        toast('Не удалось сохранить: ' + (err && err.message ? err.message : err));
      });
    });
  }
  $('shutter').addEventListener('click', shoot);

  /* ---------- старт ---------- */
  (function init(){
    try { state.saf = localStorage.getItem('suncam_saf') || null; } catch(e){}
    layout();
    startStream();
    var p = plugin();
    if (p) {
      p.getFolder().then(function(r){
        if (r && r.uri) {
          state.saf = r.uri;
          try { localStorage.setItem('suncam_saf', r.uri); } catch(e2){}
          updateFolderLabel();
        } else {
          toast('Откройте Меню → Настройки и выберите папку для сохранения');
        }
      }).catch(function(){});
    }
  })();
})();
</script>
</body>
</html>
