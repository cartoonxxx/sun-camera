<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sun Camera</title>
<style>
  :root{
    --bg:#141414; --fg:#f5f0ea; --chip:#2b2b2b; --chipfg:#f5f0ea;
    --accent:#e8967d; --muted:#bdb8b2; --toastbg:rgba(40,30,25,.92); --line:#3a3a3a;
  }
  body[data-theme="light"]{
    --bg:#f4efe9; --fg:#2b2724; --chip:#ffffff; --chipfg:#2b2724;
    --accent:#d96f4e; --muted:#6b655f; --toastbg:rgba(255,250,245,.94); --line:#ddd5cc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;}
  #view{position:fixed; inset:0; background:#000;}
  #video{width:100%; height:100%; object-fit:cover; transform-origin:center;}
  #frame{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    border:2.5px solid var(--accent); border-radius:14px; pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.45);}
  #frameLabel{position:absolute; left:50%; bottom:-34px; transform:translateX(-50%);
    color:var(--accent); font-size:15px; font-weight:600; white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,.7);}
  .chip{background:var(--chip); color:var(--chipfg); border:1px solid var(--line);
    border-radius:20px; padding:9px 15px; font-size:14.5px; font-weight:600;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  #topbar{position:fixed; top:10px; left:8px; right:8px; display:flex; gap:8px; flex-wrap:wrap; z-index:5; align-items:center;}
  #zoomBadge{margin-left:auto; background:var(--chip); color:var(--chipfg); border:1px solid var(--line);
    border-radius:14px; padding:7px 12px; font-weight:700; font-size:14px;}
  #bottombar{position:fixed; left:0; right:0; bottom:0; padding:0 0 max(14px, env(safe-area-inset-bottom)); z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:10px;}
  #modeInfo{color:var(--muted); font-size:13.5px; font-weight:600;
    background:var(--toastbg); padding:5px 14px; border-radius:14px;}
  .zoomrow{display:flex; gap:14px;}
  .zoomrow button{width:58px; height:44px; border-radius:14px; border:none;
    background:var(--chip); color:var(--chipfg); font-size:22px; font-weight:700;}
  #btnFlip{background:var(--chip); color:var(--chipfg); border:1px solid var(--line);
    border-radius:20px; padding:9px 18px; font-size:14.5px; font-weight:600;}
  #shutter{width:74px; height:74px; border-radius:50%; border:4px solid var(--chip);
    background:var(--accent); box-shadow:0 2px 10px rgba(0,0,0,.45);}
  #toast{position:fixed; left:50%; bottom:150px; transform:translateX(-50%);
    background:var(--toastbg); color:var(--fg); padding:11px 16px; border-radius:14px;
    font-size:14.5px; max-width:88%; text-align:center; z-index:9; display:none; line-height:1.45;}
  #startBtn{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    background:var(--accent); color:#fff; border:none; border-radius:26px;
    padding:16px 30px; font-size:18px; font-weight:700; z-index:8;}
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:none;
    align-items:flex-end; justify-content:center;}
  #sheet{background:var(--bg); color:var(--fg); width:100%; max-width:520px;
    border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
  #sheet h3{margin:0 0 4px; font-size:19px;}
  #sheet .sub{color:var(--muted); font-size:13.5px; margin:0 0 14px; line-height:1.45;}
  .opt{display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid var(--line);
    border-radius:14px; margin-bottom:10px; cursor:pointer;}
  .opt input{margin-top:3px; accent-color:var(--accent); width:18px; height:18px;}
  .opt b{display:block; font-size:15.5px;}
  .opt span{color:var(--muted); font-size:13px; line-height:1.4;}
  #sheetOk{width:100%; background:var(--accent); color:#fff; border:none; border-radius:16px;
    padding:14px; font-size:16px; font-weight:700; margin-top:4px;}
  #startHint{position:fixed; left:50%; top:62%; transform:translateX(-50%);
    color:var(--muted); font-size:14px; text-align:center; max-width:80%; z-index:8;}
</style>
</head>
<body data-theme="dark">
<div id="view">
  <video id="video" playsinline autoplay muted></video>
  <div id="frame"><div id="frameLabel"></div></div>
</div>

<div id="topbar">
  <button class="chip" id="btnStory">Сторис</button>
  <button class="chip" id="btnWorks">Работы</button>
  <button class="chip" id="btnCam">Камера ⇄</button>
  <button class="chip" id="btnTheme">Тёмная</button>
  <button class="chip" id="btnSettings">⚙ Настройки</button>
  <div id="zoomBadge">×1.0</div>
</div>

<div id="bottombar">
  <div id="modeInfo"></div>
  <div class="zoomrow">
    <button id="zoomOut">−</button>
    <button id="zoomIn">+</button>
  </div>
  <button id="btnFlip">Повернуть: горизонталь</button>
  <button id="shutter" aria-label="Снять"></button>
</div>

<div id="toast"></div>
<button id="startBtn">Включить камеру</button>
<div id="startHint">Разреши доступ к камере, когда телефон спросит</div>

<div id="modal">
  <div id="sheet">
    <h3>Куда сохранять файлы</h3>
    <p class="sub">Выбранное место используется для всех снимков. Если система не разрешит запись — приложение само запишет в запасной вариант и покажет путь.</p>
    <div id="optList"></div>
    <button id="sheetOk">Готово</button>
  </div>
</div>

<script>
var FS = null;
try { FS = Capacitor.Plugins.Filesystem; } catch(e) { FS = null; }

var DIRS = [
  { id:'docs', label:'Документы / SunCamera', dir:'DOCUMENTS', path:'SunCamera',
    hint:'Основной вариант: папка SunCamera в «Документах» телефона' },
  { id:'ext',  label:'Память телефона / SunCamera', dir:'EXTERNAL_STORAGE', path:'SunCamera',
    hint:'Общая память устройства: /storage/emulated/0/SunCamera' },
  { id:'app',  label:'Папка приложения', dir:'EXTERNAL', path:'SunCamera',
    hint:'Надёжный вариант без разрешений: Android/data/ru.sunnails.suncamera/files/SunCamera' }
];
var saveDirId = localStorage.getItem('sc_savedir') || 'docs';

var video = document.getElementById('video');
var view = document.getElementById('view');
var frameEl = document.getElementById('frame');
var frameLabel = document.getElementById('frameLabel');
var modeInfo = document.getElementById('modeInfo');
var zoomBadge = document.getElementById('zoomBadge');
var toast = document.getElementById('toast');
var btnFlip = document.getElementById('btnFlip');

var mode = 'story';
var worksOrient = 'h';
var zoom = 1;
var facing = 'environment';
var stream = null;
var busy = false;
var toastTimer = null;

function showToast(msg){
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.style.display = 'none'; }, 4200);
}

/* ---------- режимы и рамка ---------- */
function frameAspect(){
  if (mode === 'story') return 9/16;
  return worksOrient === 'h' ? 4/3 : 3/4;
}
function layoutFrame(){
  var r = view.getBoundingClientRect();
  var a = frameAspect();
  var w = Math.min(r.width * 0.92, r.height * 0.86 * a);
  var h = w / a;
  frameEl.style.width = w + 'px';
  frameEl.style.height = h + 'px';
  if (mode === 'story'){
    frameLabel.textContent = 'Сторис 1080×1920 · обложка 800×800';
  } else if (worksOrient === 'h'){
    frameLabel.textContent = 'Работа 1600×1200';
  } else {
    frameLabel.textContent = 'Работа 1200×1600';
  }
  modeInfo.textContent = mode === 'story'
    ? 'Один снимок: кадр + обложка + оригинал'
    : (worksOrient === 'h' ? 'Работа: горизонталь 1600×1200 + оригинал' : 'Работа: вертикаль 1200×1600 + оригинал');
}
window.addEventListener('resize', layoutFrame);

function setMode(m){
  mode = m;
  document.getElementById('btnStory').classList.toggle('active', m === 'story');
  document.getElementById('btnWorks').classList.toggle('active', m === 'works');
  btnFlip.style.display = m === 'works' ? 'block' : 'none';
  layoutFrame();
}
document.getElementById('btnStory').onclick = function(){ setMode('story'); };
document.getElementById('btnWorks').onclick = function(){ setMode('works'); };
btnFlip.onclick = function(){
  worksOrient = worksOrient === 'h' ? 'v' : 'h';
  btnFlip.textContent = 'Повернуть: ' + (worksOrient === 'h' ? 'горизонталь' : 'вертикаль');
  layoutFrame();
};

/* ---------- камера ---------- */
async function startCamera(){
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play().catch(function(){});
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('startHint').style.display = 'none';
    layoutFrame();
  } catch (err) {
    showToast('Нет доступа к камере: ' + err.name + '. Проверь разрешения: Настройки → Приложения → Sun Camera → Разрешения → Камера.');
  }
}
document.getElementById('startBtn').onclick = startCamera;
document.getElementById('btnCam').onclick = function(){
  facing = facing === 'environment' ? 'user' : 'environment';
  startCamera();
};

/* ---------- зум ---------- */
function applyZoom(){
  zoom = Math.min(4, Math.max(1, zoom));
  video.style.transform = 'scale(' + zoom + ')';
  zoomBadge.textContent = '×' + zoom.toFixed(1);
}
document.getElementById('zoomIn').onclick = function(){ zoom += 0.2; applyZoom(); };
document.getElementById('zoomOut').onclick = function(){ zoom -= 0.2; applyZoom(); };
view.addEventListener('wheel', function(e){ e.preventDefault(); zoom += (e.deltaY < 0 ? 0.1 : -0.1); applyZoom(); }, {passive:false});

var pinch = null;
view.addEventListener('touchstart', function(e){
  if (e.touches.length === 2){
    pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  }
}, {passive:true});
view.addEventListener('touchmove', function(e){
  if (e.touches.length === 2 && pinch){
    var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
    zoom *= d / pinch;
    pinch = d;
    applyZoom();
  }
}, {passive:true});
view.addEventListener('touchend', function(){ pinch = null; });

/* ---------- тема ---------- */
var btnTheme = document.getElementById('btnTheme');
function applyTheme(t){
  document.body.setAttribute('data-theme', t);
  btnTheme.textContent = t === 'dark' ? 'Тёмная' : 'Светлая';
  localStorage.setItem('sc_theme', t);
}
btnTheme.onclick = function(){
  applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
};
applyTheme(localStorage.getItem('sc_theme') || 'dark');

/* ---------- настройки: место сохранения ---------- */
var modal = document.getElementById('modal');
var optList = document.getElementById('optList');

function renderOptions(){
  optList.innerHTML = '';
  DIRS.forEach(function(d){
    var wrap = document.createElement('label');
    wrap.className = 'opt';
    var input = document.createElement('input');
    input.type = 'radio';
    input.name = 'savedir';
    input.checked = (d.id === saveDirId);
    input.onchange = function(){ saveDirId = d.id; localStorage.setItem('sc_savedir', d.id); };
    var text = document.createElement('div');
    var b = document.createElement('b'); b.textContent = d.label;
    var s = document.createElement('span'); s.textContent = d.hint;
    text.appendChild(b); text.appendChild(s);
    wrap.appendChild(input); wrap.appendChild(text);
    optList.appendChild(wrap);
  });
}
document.getElementById('btnSettings').onclick = function(){
  renderOptions();
  modal.style.display = 'flex';
};
document.getElementById('sheetOk').onclick = function(){
  modal.style.display = 'none';
  var d = DIRS.filter(function(x){ return x.id === saveDirId; })[0];
  showToast('Сохранение: ' + d.label);
};
modal.addEventListener('click', function(e){ if (e.target === modal) modal.style.display = 'none'; });

/* ---------- нумерация ---------- */
async function nextIndex(directory, path, base){
  var names = [];
  try {
    var res = await FS.readdir({ path: path, directory: directory });
    names = res.files.map(function(f){ return f.name; });
  } catch(e) {}
  var taken = names.some(function(n){
    return n === base + '.jpg' || n.indexOf(base + '_') === 0;
  });
  if (!taken) return 1;
  var mx = 1;
  names.forEach(function(n){
    var m = n.match(new RegExp('^' + base + '_(\\d+)\\.jpg$'));
    if (m) mx = Math.max(mx, parseInt(m[1], 10));
  });
  return mx + 1;
}

async function saveFile(directory, dirPath, base, dataUrl){
  var n = await nextIndex(directory, dirPath, base);
  var name = (n === 1) ? base + '.jpg' : base + '_' + n + '.jpg';
  await FS.writeFile({
    path: dirPath + '/' + name,
    directory: directory,
    data: dataUrl,
    recursive: true
  });
  return name;
}

async function saveAll(items){
  /* items: [{base, dataUrl}] — пишем в выбранное место, при сбое по цепочке запасных */
  var order = DIRS.map(function(d){ return d.id; });
  var chosen = saveDirId;
  order = [chosen].concat(order.filter(function(id){ return id !== chosen; }));
  var label = '';
  for (var i = 0; i < order.length; i++){
    var d = DIRS.filter(function(x){ return x.id === order[i]; })[0];
    try {
      var names = [];
      for (var j = 0; j < items.length; j++){
        names.push(await saveFile(d.dir, d.path, items[j].base, items[j].dataUrl));
      }
      label = d.label;
      if (i > 0) showToast('Записано в запасное место: ' + label + ' (' + names.join(', ') + ')');
      else showToast('Сохранено: ' + label + ' (' + names.join(', ') + ')');
      return;
    } catch(e) { /* пробуем следующий вариант */ }
  }
  showToast('Не удалось сохранить файлы: нет доступа к памяти. Проверь разрешения приложения.');
}

/* ---------- съёмка ---------- */
function cropCanvas(){
  var vw = video.videoWidth, vh = video.videoHeight;
  var r = view.getBoundingClientRect();
  var s = Math.max(r.width / vw, r.height / vh) * zoom;
  var dispW = vw * s, dispH = vh * s;
  var ox = (r.width - dispW) / 2, oy = (r.height - dispH) / 2;
  var f = frameEl.getBoundingClientRect();
  var sx = (f.left - r.left - ox) / s;
  var sy = (f.top - r.top - oy) / s;
  var sw = f.width / s, sh = f.height / s;
  var full = document.createElement('canvas');
  full.width = vw; full.height = vh;
  full.getContext('2d').drawImage(video, 0, 0);
  var crop = document.createElement('canvas');
  crop.width = Math.round(sw); crop.height = Math.round(sh);
  crop.getContext('2d').drawImage(full, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
  return { full: full, crop: crop };
}
function resizeTo(c, w, h){
  var out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(c, 0, 0, w, h);
  return out;
}
function toJpeg(c){ return c.toDataURL('image/jpeg', 0.92); }

document.getElementById('shutter').onclick = async function(){
  if (busy || !stream) return;
  busy = true;
  try {
    var parts = cropCanvas();
    if (mode === 'story'){
      var kadr = resizeTo(parts.crop, 1080, 1920);
      var side = parts.crop.width; /* 1080 — центральный квадрат */
      var sq = document.createElement('canvas');
      sq.width = side; sq.height = side;
      sq.getContext('2d').drawImage(parts.crop, 0, (parts.crop.height - side) / 2, side, side, 0, 0, side, side);
      var obl = resizeTo(sq, 800, 800);
      await saveAll([
        { base: 'kadr_storis', dataUrl: toJpeg(kadr) },
        { base: 'oblojka_storis', dataUrl: toJpeg(obl) },
        { base: 'original_ctoris_kadr', dataUrl: toJpeg(parts.full) }
      ]);
    } else {
      var work = worksOrient === 'h' ? resizeTo(parts.crop, 1600, 1200) : resizeTo(parts.crop, 1200, 1600);
      await saveAll([
        { base: 'raboti', dataUrl: toJpeg(work) },
        { base: 'original_raboti', dataUrl: toJpeg(parts.full) }
      ]);
    }
  } catch(e) {
    showToast('Ошибка сохранения: ' + e);
  }
  busy = false;
};

setMode('story');
applyZoom();
</script>
</body>
</html>
