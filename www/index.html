<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Sun Camera</title>
<style>
:root{
  --accent:#e89a7e; --accent2:#f2a68c; --teal:#6fe0c8;
  --bg:#0d0b0a; --panel:rgba(28,24,22,.94); --btn:rgba(40,34,30,.86); --text:#f5efe9; --muted:#c2b6ac;
}
body.light{ --panel:rgba(255,252,248,.96); --btn:rgba(255,255,255,.92); --text:#2a2420; --muted:#7a6f66; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}
#videoWrap{position:fixed;inset:0;}
#video{width:100%;height:100%;object-fit:cover;transform-origin:center center;}
.frame{position:fixed;border:3px solid var(--accent2);border-radius:14px;pointer-events:none;display:none;z-index:3;box-shadow:0 0 0 1px rgba(0,0,0,.25);}
#frameCover{border:3px dashed var(--teal);background:rgba(111,224,200,.08);border-radius:8px;}
#topbar{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;z-index:6;}
#btnMenu{background:var(--btn);color:var(--text);border:none;border-radius:20px;padding:10px 16px;font-size:15px;font-weight:600;}
#statusLine{margin-top:8px;font-size:13px;color:var(--muted);text-shadow:0 1px 2px rgba(0,0,0,.6);}
#menu{position:fixed;left:12px;min-width:210px;background:var(--panel);border-radius:14px;padding:8px;display:none;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.45);}
#menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:12px;font-size:16px;border-radius:10px;}
#zoomRow{position:fixed;bottom:calc(160px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:5;}
#zoomRow button{width:46px;height:46px;border-radius:14px;border:none;background:var(--btn);color:var(--text);font-size:20px;font-weight:700;}
#zoomBadge{position:fixed;right:14px;bottom:calc(168px + env(safe-area-inset-bottom));background:var(--btn);border-radius:12px;padding:6px 10px;font-size:14px;font-weight:600;z-index:5;}
#shutter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;background:var(--accent);border:4px solid #fff;z-index:5;padding:0;}
#hint{position:fixed;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom));text-align:center;font-size:15px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:4;display:none;}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));z-index:12;transform:translateY(110%);transition:transform .25s;}
#sheet.open{transform:translateY(0);}
.sheet-title{font-size:18px;font-weight:700;margin-bottom:12px;}
#folderNow{font-size:14px;color:var(--muted);margin-bottom:12px;word-break:break-all;}
#folderNow b{color:var(--text);}
#sheet button{display:block;width:100%;padding:13px;border:none;border-radius:12px;background:var(--btn);color:var(--text);font-size:15px;margin-bottom:10px;}
#btnPick{background:var(--accent) !important;color:#fff !important;font-weight:600;}
.note{font-size:12px;color:var(--muted);line-height:1.45;}
#toast{position:fixed;left:14px;right:14px;bottom:calc(200px + env(safe-area-inset-bottom));background:rgba(20,16,14,.93);color:#f5efe9;border-radius:12px;padding:12px 14px;font-size:13.5px;z-index:9;display:none;line-height:1.4;white-space:pre-line;}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity .12s;}
</style>
</head>
<body>
<div id="videoWrap"><video id="video" autoplay playsinline muted></video></div>
<div id="frameStories" class="frame"></div>
<div id="frameCover" class="frame"></div>
<div id="frameWorks" class="frame"></div>
<div id="topbar">
  <button id="btnMenu">☰ Меню</button>
  <div id="statusLine"></div>
</div>
<div id="menu">
  <button id="miStoris">◉ Сторис</button>
  <button id="miRaboty">◉ Работы</button>
  <button id="miCam">Камера ⇄</button>
  <button id="miTheme">Светлая тема</button>
  <button id="miSettings">⚙ Настройки</button>
</div>
<div id="zoomRow"><button id="zoomOut">−</button><button id="zoomIn">+</button></div>
<div id="zoomBadge">x1.0</div>
<div id="hint">Повернуть: горизонталь</div>
<button id="shutter"></button>
<div id="sheet">
  <div class="sheet-title">Настройки</div>
  <div id="folderNow"></div>
  <button id="btnPick">📁 Выбрать папку через проводник…</button>
  <button id="btnReset">Сбросить выбор папки</button>
  <div class="note">Снимки сохраняются прямо в выбранную папку — без создания дополнительных папок. Выбор запоминается навсегда. Если папка не выбрана, файлы идут в Документы/SunCamera.</div>
</div>
<div id="toast"></div>
<div id="flash"></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var video = $('video'), wrap = $('videoWrap');
  var fS = $('frameStories'), fC = $('frameCover'), fW = $('frameWorks');
  var statusLine = $('statusLine'), toast = $('toast'), hint = $('hint');
  var menu = $('menu'), sheet = $('sheet');

  var Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
  var SafPicker = Plugins.SafPickerPlugin || null;
  var Fs = Plugins.Filesystem || null;

  var mode = localStorage.getItem('sunMode') || 'storis';
  var facing = localStorage.getItem('sunFacing') || 'environment';
  var light = localStorage.getItem('sunLight') === '1';
  var folderUri = localStorage.getItem('sunFolderUri') || '';
  var zoom = 1;
  var stream = null, busy = false, toastTimer = null;

  function showToast(msg){
    toast.textContent = msg; toast.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toast.style.display='none'; }, 4500);
  }

  // ---------- камера ----------
  async function startCamera(){
    try{
      if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode: facing, width:{ideal:1920}, height:{ideal:1440} }, audio:false
      });
      video.srcObject = stream;
      await video.play().catch(function(){});
    }catch(e){ showToast('Камера недоступна: ' + (e.message || e.name || '')); }
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){ setTimeout(startCamera, 100); }
  });
  window.addEventListener('focus', function(){ setTimeout(startCamera, 150); });

  // ---------- рамки ----------
  function setRect(el,x,y,w,h){ el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=w+'px'; el.style.height=h+'px'; el.style.display='block'; }
  function layout(){
    var wr = wrap.getBoundingClientRect();
    if(!wr.width) return;
    var availTop = $('topbar').getBoundingClientRect().bottom + 12;
    var zoomR = $('zoomRow').getBoundingClientRect();
    var availBottom = zoomR.top - 14;
    var availH = Math.max(140, availBottom - availTop);
    if(mode === 'storis'){
      var h = availH * 0.8, w = h * 9 / 16;
      if(w > wr.width * 0.92){ w = wr.width * 0.92; h = w * 16 / 9; }
      var x = (wr.width - w) / 2, y = availTop + (availH - h) / 2;
      setRect(fS, x, y, w, h);
      var ch = h * 800 / 1920;
      setRect(fC, x, y + (h - ch) / 2, w, ch);
    } else {
      var h2 = availH * 0.62, w2 = h2 * 4 / 3;
      if(w2 > wr.width * 0.94){ w2 = wr.width * 0.94; h2 = w2 * 3 / 4; }
      setRect(fW, (wr.width - w2) / 2, availTop + (availH - h2) / 2, w2, h2);
    }
  }
  function applyMode(){
    fS.style.display = fC.style.display = fW.style.display = 'none';
    layout();
    statusLine.textContent = mode === 'storis' ? 'Сторис: кадр 1080×1920 + обложка 1080×800' : 'Работа 1600×1200';
    hint.style.display = mode === 'raboty' ? 'block' : 'none';
    localStorage.setItem('sunMode', mode);
  }

  // ---------- тема / зум ----------
  function applyTheme(){
    document.body.classList.toggle('light', light);
    $('miTheme').textContent = light ? 'Тёмная тема' : 'Светлая тема';
    localStorage.setItem('sunLight', light ? '1' : '0');
  }
  function setZoom(z){
    zoom = Math.min(3, Math.max(1, Math.round(z * 10) / 10));
    video.style.transform = (facing === 'front' ? 'scaleX(-1) ' : '') + 'scale(' + zoom + ')';
    $('zoomBadge').textContent = 'x' + zoom.toFixed(1);
  }

  // ---------- меню ----------
  $('btnMenu').addEventListener('click', function(e){
    e.stopPropagation();
    menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
  });
  document.addEventListener('click', function(e){
    if(menu.style.display === 'block' && !menu.contains(e.target) && e.target !== $('btnMenu')){ menu.style.display = 'none'; }
  });
  function closeMenu(){ menu.style.display = 'none'; }
  $('miStoris').onclick = function(){ mode='storis'; applyMode(); closeMenu(); };
  $('miRaboty').onclick = function(){ mode='raboty'; applyMode(); closeMenu(); };
  $('miCam').onclick = function(){ facing = facing==='environment'?'user':'environment'; localStorage.setItem('sunFacing',facing); setZoom(zoom); startCamera(); closeMenu(); };
  $('miTheme').onclick = function(){ light = !light; applyTheme(); closeMenu(); };
  $('miSettings').onclick = function(){ closeMenu(); openSheet(); };
  $('zoomIn').onclick = function(){ setZoom(zoom + 0.1); };
  $('zoomOut').onclick = function(){ setZoom(zoom - 0.1); };

  // ---------- настройки: папка ----------
  function folderLabel(uri){
    if(!uri) return 'не выбрана — Документы/SunCamera';
    try{
      var m = uri.match(/tree\/([^\/\?]+)/);
      if(m) return decodeURIComponent(m[1]).replace(/^.*?:/,'');
    }catch(e){}
    return uri.slice(-40);
  }
  function renderFolder(){
    $('folderNow').innerHTML = 'Папка сохранения: <b>' + folderLabel(folderUri) + '</b>';
  }
  function openSheet(){ renderFolder(); sheet.classList.add('open'); }
  function closeSheet(){ sheet.classList.remove('open'); }
  document.addEventListener('click', function(e){
    if(sheet.classList.contains('open') && !sheet.contains(e.target)){ closeSheet(); }
  });
  $('btnPick').addEventListener('click', function(e){
    e.stopPropagation();
    try{
      if(!SafPicker){ showToast('Проводник недоступен в этой сборке'); return; }
      SafPicker.pickFolder().then(function(res){
        if(res && res.uri){
          folderUri = res.uri;
          localStorage.setItem('sunFolderUri', folderUri);
          renderFolder();
          showToast('Папка сохранения:\n' + folderLabel(folderUri));
        }
        closeSheet();
      }).catch(function(err){ showToast('Проводник не открылся: ' + (err && err.message || err)); });
    }catch(err){ showToast('Проводник не открылся: ' + (err.message || err)); }
  });
  $('btnReset').addEventListener('click', function(e){
    e.stopPropagation();
    folderUri = ''; localStorage.removeItem('sunFolderUri'); renderFolder();
    showToast('Сброшено. Файлы пойдут в Документы/SunCamera');
  });

  // ---------- сохранение ----------
  function dataUrl(c){ return c.toDataURL('image/jpeg', 0.92).split(',')[1]; }
  function allocate(files, names){
    var idx = {};
    for(var i=0;i<files.length;i++){
      var f = files[i];
      if(f.follow){ idx[f.base] = idx[f.follow]; continue; }
      var n = 1;
      while(names.has(f.base + (n===1?'':'__'+n) + '.jpg')) n++;
      idx[f.base] = n;
      names.add(f.base + (n===1?'':'__'+n) + '.jpg');
    }
    return idx;
  }
  function nameFor(base, n){ return base + (n===1?'':'__'+n) + '.jpg'; }

  async function saveAll(files){
    var saved = [];
    if(folderUri && SafPicker){
      try{
        var listing = await SafPicker.listFiles({ uri: folderUri });
        var names = new Set((listing && listing.files) || []);
        var idx = allocate(files, names);
        for(var i=0;i<files.length;i++){
          var name = nameFor(files[i].base, idx[files[i].base]);
          var r = await SafPicker.saveFile({ uri: folderUri, name: name, data: files[i].data });
          saved.push((r && r.name) || name);
        }
        showToast('Сохранено в ' + folderLabel(folderUri) + ':\n' + saved.join(', '));
        return;
      }catch(e){ /* переходим к запасному варианту */ }
    }
    if(Fs){
      var dirs = [ {label:'Документы/SunCamera', directory:'DOCUMENTS'}, {label:'Память приложения/SunCamera', directory:'EXTERNAL'} ];
      for(var d=0; d<dirs.length; d++){
        try{
          try{ await Fs.mkdir({ path:'SunCamera', directory: dirs[d].directory, recursive:true }); }catch(e2){}
          var names2 = new Set();
          try{
            var l2 = await Fs.readdir({ path:'SunCamera', directory: dirs[d].directory });
            (l2.files || []).forEach(function(f){ names2.add(f.name); });
          }catch(e3){}
          var idx2 = allocate(files, names2);
          for(var j=0;j<files.length;j++){
            var nm = nameFor(files[j].base, idx2[files[j].base]);
            await Fs.writeFile({ path:'SunCamera/' + nm, directory: dirs[d].directory, data: files[j].data });
            saved.push(nm);
          }
          showToast('Сохранено в ' + dirs[d].label + ':\n' + saved.join(', '));
          return;
        }catch(e4){ saved = []; }
      }
    }
    for(var k=0;k<files.length;k++){
      var a = document.createElement('a');
      a.href = 'data:image/jpeg;base64,' + files[k].data;
      a.download = files[k].base + '.jpg';
      a.click();
    }
    showToast('Файлы отправлены в Загрузки браузера');
  }

  // ---------- снимок ----------
  function flash(){ var f=$('flash'); f.style.opacity='0.85'; setTimeout(function(){ f.style.opacity='0'; },120); }

  async function shot(){
    if(busy) return; busy = true;
    try{
      if(!stream || !video.videoWidth){ showToast('Камера ещё не готова'); return; }
      flash();
      var vw = video.videoWidth, vh = video.videoHeight;
      var wr = wrap.getBoundingClientRect();
      var scale = Math.max(wr.width / vw, wr.height / vh) * zoom;
      var fr = (mode === 'storis' ? fS : fW).getBoundingClientRect();
      var toV = function(sx, sy){
        return [ vw/2 + (sx - (wr.left + wr.width/2)) / scale,
                 vh/2 + (sy - (wr.top + wr.height/2)) / scale ];
      };
      var p1 = toV(fr.left, fr.top), p2 = toV(fr.right, fr.bottom);
      var sw = p2[0] - p1[0], sh = p2[1] - p1[1];
      var sx = Math.max(0, Math.min(p1[0], vw - sw));
      var sy = Math.max(0, Math.min(p1[1], vh - sh));

      var full = document.createElement('canvas'); full.width = vw; full.height = vh;
      var fctx = full.getContext('2d');
      fctx.translate(vw/2, vh/2);
      if(facing === 'front') fctx.scale(-1, 1);
      fctx.scale(zoom, zoom);
      fctx.drawImage(video, -vw/2, -vh/2, vw, vh);

      function crop(cw, chh, rx, ry, rw, rh){
        var c = document.createElement('canvas'); c.width = cw; c.height = chh;
        c.getContext('2d').drawImage(full, rx, ry, rw, rh, 0, 0, cw, chh);
        return dataUrl(c);
      }
      var files;
      if(mode === 'storis'){
        var chH = sh * 800 / 1920, cy = sy + (sh - chH) / 2;
        files = [
          { base:'kadr_storis',          data: crop(1080, 1920, sx, sy, sw, sh) },
          { base:'oblojka_storis',       data: crop(1080, 800,  sx, cy, sw, chH), follow:'kadr_storis' },
          { base:'original_ctoris_kadr', data: dataUrl(full), follow:'kadr_storis' }
        ];
      } else {
        files = [
          { base:'rabota_kadr',      data: crop(1600, 1200, sx, sy, sw, sh) },
          { base:'original_raboty',  data: dataUrl(full), follow:'rabota_kadr' }
        ];
      }
      await saveAll(files);
    }catch(e){
      showToast('Ошибка снимка: ' + (e.message || e));
    }finally{ busy = false; }
  }
  $('shutter').addEventListener('click', shot);

  // ---------- старт ----------
  applyTheme(); applyMode(); setZoom(1); renderFolder(); startCamera();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 300); });
})();
</script>
</body>
</html>
