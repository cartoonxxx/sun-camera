<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sun Nails Camera</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#141414; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; color:#fff; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; transform-origin:center center; }
  #topbar { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; pointer-events:none; }
  #menuBtn { pointer-events:auto; background:rgba(20,20,20,.82); border:none; color:#fff; font-size:15px; font-weight:600; padding:10px 16px; border-radius:24px; }
  #modeTag { margin-left:auto; background:rgba(20,20,20,.6); color:#e8a087; font-size:13px; padding:8px 14px; border-radius:20px; }
  #menu { position:fixed; top:calc(52px + env(safe-area-inset-top)); left:12px; z-index:60; background:rgba(20,20,20,.96); border-radius:16px; padding:6px; display:none; min-width:220px; box-shadow:0 8px 30px rgba(0,0,0,.6); }
  #menu.open { display:block; }
  #menu button { display:block; width:100%; text-align:left; background:none; border:none; color:#fff; font-size:15px; padding:12px 14px; border-radius:10px; }
  #menu button:active, #menu button.active { background:rgba(232,160,135,.22); color:#e8a087; }
  #frame { position:fixed; z-index:10; border:2px solid #f2a68c; border-radius:10px; box-shadow:0 0 0 10000px rgba(0,0,0,.28); }
  #bottombar { position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 12px calc(16px + env(safe-area-inset-bottom)); }
  .zoomBtn { width:44px; height:44px; border-radius:50%; border:none; background:rgba(20,20,20,.82); color:#fff; font-size:20px; }
  #zoomTag { color:#fff; font-size:13px; background:rgba(20,20,20,.6); padding:6px 10px; border-radius:14px; }
  #shutter { width:84px; height:84px; border-radius:50%; border:5px solid #fff; background:#e8a087; }
  #toast { position:fixed; left:50%; bottom:calc(130px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(30,20,16,.92); color:#fff; padding:11px 18px; border-radius:14px; font-size:14px; z-index:200; max-width:88vw; text-align:center; display:none; }
  #busy { position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; color:#fff; font-size:16px; }
  #gallery { position:fixed; inset:0; z-index:150; background:#141414; display:none; flex-direction:column; }
  #gallery.open { display:flex; }
  #gHead { display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; }
  #gHead button { background:rgba(255,255,255,.1); border:none; color:#fff; padding:10px 14px; border-radius:12px; font-size:14px; }
  #gPath { color:#bbb; font-size:12px; flex:1; text-align:center; }
  #grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:4px; }
  #grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#222; }
  #gEmpty { color:#888; text-align:center; padding:40px 20px; font-size:14px; }
  #viewer { position:fixed; inset:0; z-index:180; background:#000; display:none; flex-direction:column; }
  #viewer.open { display:flex; }
  #vImgWrap { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #vImg { max-width:100%; max-height:100%; }
  #vBar { display:flex; gap:10px; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); justify-content:center; }
  #vBar button { background:rgba(255,255,255,.12); border:none; color:#fff; padding:12px 18px; border-radius:14px; font-size:15px; }
  #vName { color:#bbb; font-size:12px; text-align:center; padding-bottom:6px; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div id="frame"></div>
<div id="topbar">
  <button id="menuBtn">☰ Меню</button>
  <span id="modeTag">Сторис</span>
</div>
<div id="menu">
  <button data-act="m-storis">Сторис</button>
  <button data-act="m-oblojka">Обложка сторис</button>
  <button data-act="m-rabota">Работы</button>
  <button data-act="m-rotate">Поворот работ: горизонталь</button>
  <button data-act="m-cam">Камера: основная</button>
  <button data-act="m-gallery">🖼 Галерея</button>
  <button data-act="m-folder">📁 Папка: Sun Nails</button>
</div>
<div id="bottombar">
  <button class="zoomBtn" id="zOut">−</button>
  <span id="zoomTag">x1.0</span>
  <button class="zoomBtn" id="zIn">+</button>
  <button id="shutter"></button>
</div>
<div id="gallery">
  <div id="gHead">
    <button id="gBack">← Закрыть</button>
    <span id="gPath">Документы / Sun Nails</span>
    <button id="gRefresh">↻</button>
  </div>
  <div id="grid"></div>
  <div id="gEmpty">Пока нет снимков. Сделайте первый!</div>
</div>
<div id="viewer">
  <div id="vImgWrap"><img id="vImg" alt=""></div>
  <div id="vName"></div>
  <div id="vBar">
    <button id="vShare">↗ Поделиться</button>
    <button id="vDel">🗑 Удалить</button>
    <button id="vClose">← Назад</button>
  </div>
</div>
<div id="toast"></div>
<div id="busy">Сохраняю…</div>
<script>
"use strict";
var MODES = {
  storis:  { label:'Сторис',          file:'kadr_storis',     ratio:1080/1920, targetW:1080 },
  oblojka: { label:'Обложка сторис',  file:'oblojka_storis',  ratio:1080/800,  targetW:1080 },
  rabota:  { label:'Работы',          file:'rabota',          ratio:4/3,       targetW:1600, rotatable:true }
};
var curMode='storis', workHoriz=true, facing='environment', zoom=1.0;
var stream=null, frame={cx:.5, cy:.5, w:.92};
var video=document.getElementById('cam'), frameEl=document.getElementById('frame');
var FS = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) || null;
var DIR='Sun Nails';
var toastT=null;

function toast(msg, ms){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(toastT); toastT=setTimeout(function(){ t.style.display='none'; }, ms||2600);
}
function busy(on){ document.getElementById('busy').style.display = on ? 'flex' : 'none'; }

/* ---------- Рамка: пропорция, позиция, жесты ---------- */
function curRatio(){
  if (curMode==='rabota') return workHoriz ? 4/3 : 3/4;
  return MODES[curMode].ratio;
}
function layoutFrame(){
  var W=window.innerWidth, H=window.innerHeight;
  var r=curRatio();
  var w = Math.min(frame.w, (H-120)*r/W);
  w = Math.max(w, .18*W);
  var fw=w, fh=fw/r;
  if (fh > H-90){ fh=H-90; fw=fh*r; frame.w=fw/W; }
  var x=frame.cx*W-fw/2, y=frame.cy*H-fh/2;
  x=Math.max(2, Math.min(W-fw-2, x));
  y=Math.max(2, Math.min(H-fh-2, y));
  frameEl.style.left=x+'px'; frameEl.style.top=y+'px';
  frameEl.style.width=fw+'px'; frameEl.style.height=fh+'px';
}
var touchMode=null, t0=null;
function fRect(){ return frameEl.getBoundingClientRect(); }
frameEl.addEventListener('touchstart', function(e){
  if (e.touches.length===1){ touchMode='move'; var r=fRect(); t0={x:e.touches[0].clientX, y:e.touches[0].clientY, fx:r.left, fy:r.top, w:r.width, d:0}; }
  else if (e.touches.length===2){ touchMode='pinch'; var r2=fRect(); t0={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY), w:r2.width, cx:(e.touches[0].clientX+e.touches[1].clientX)/2, cy:(e.touches[0].clientY+e.touches[1].clientY)/2, fcx:(r2.left+r2.right)/2, fcy:(r2.top+r2.bottom)/2}; }
  e.preventDefault();
}, {passive:false});
frameEl.addEventListener('touchmove', function(e){
  var W=window.innerWidth, H=window.innerHeight, r=curRatio();
  if (touchMode==='move' && e.touches.length===1 && t0){
    var nx=t0.fx+(e.touches[0].clientX-t0.x), ny=t0.fy+(e.touches[0].clientY-t0.y);
    var fw=frameEl.getBoundingClientRect().width, fh=fw/r;
    frame.cx=(Math.max(2,Math.min(W-fw-2,nx))+fw/2)/W;
    frame.cy=(Math.max(2,Math.min(H-fh-2,ny))+fh/2)/H;
    layoutFrame();
  } else if (touchMode==='pinch' && e.touches.length===2 && t0){
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    var nw=Math.max(.18*W, Math.min(.97*W, t0.w*d/t0.d));
    frame.w=nw/W;
    layoutFrame();
  }
  e.preventDefault();
}, {passive:false});
frameEl.addEventListener('touchend', function(e){ if (e.touches.length===0){ touchMode=null; t0=null; } }, {passive:false});
window.addEventListener('resize', layoutFrame);

/* ---------- Камера ---------- */
async function initCamera(){
  try {
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: facing, width:{ideal:2560}, height:{ideal:1440} }, audio:false });
    video.srcObject=stream;
    await video.play().catch(function(){});
  } catch(err){
    toast('Камера недоступна: '+(err && err.name ? err.name : 'ошибка'), 4000);
  }
}
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && !document.getElementById('gallery').classList.contains('open')) initCamera();
});

/* ---------- Зум камеры ---------- */
function setZoom(z){
  zoom=Math.max(1, Math.min(5, z));
  video.style.transform='scale('+zoom+')';
  document.getElementById('zoomTag').textContent='x'+zoom.toFixed(1);
}
document.getElementById('zIn').onclick=function(){ setZoom(zoom+0.5); };
document.getElementById('zOut').onclick=function(){ setZoom(zoom-0.5); };

/* ---------- Меню ---------- */
var menuEl=document.getElementById('menu');
document.getElementById('menuBtn').onclick=function(e){ menuEl.classList.toggle('open'); e.stopPropagation(); };
document.addEventListener('click', function(e){ if (!menuEl.contains(e.target) && e.target.id!=='menuBtn') menuEl.classList.remove('open'); });
function markMode(){
  document.getElementById('modeTag').textContent=MODES[curMode].label;
  var bs=menuEl.querySelectorAll('button[data-act]');
  for (var i=0;i<bs.length;i++){
    var a=bs[i].getAttribute('data-act');
    bs[i].classList.toggle('active', a==='m-'+curMode);
  }
  document.querySelector('#menu button[data-act=m-rotate]').textContent='Поворот работ: '+(workHoriz?'горизонталь':'вертикаль');
  document.querySelector('#menu button[data-act=m-cam]').textContent='Камера: '+(facing==='environment'?'основная':'фронтальная');
}
menuEl.addEventListener('click', function(e){
  var act=e.target && e.target.getAttribute ? e.target.getAttribute('data-act') : null;
  if (!act) return;
  menuEl.classList.remove('open');
  if (act==='m-storis'||act==='m-oblojka'||act==='m-rabota'){ curMode=act.slice(2); frame.w=.92; layoutFrame(); markMode(); }
  else if (act==='m-rotate'){ workHoriz=!workHoriz; frame.w=.92; layoutFrame(); markMode(); }
  else if (act==='m-cam'){ facing=(facing==='environment'?'user':'environment'); initCamera(); markMode(); }
  else if (act==='m-gallery'){ openGallery(); }
  else if (act==='m-folder'){ toast('Файлы сохраняются в: Документы / '+DIR+(FS?'':' (браузер — скачивание)')); }
});

/* ---------- Координаты: экран -> видео ---------- */
function screenToVideo(px, py){
  var W=window.innerWidth, H=window.innerHeight;
  var vw=video.videoWidth, vh=video.videoHeight;
  var k=Math.max(W/vw, H/vh), ox=(W-vw*k)/2, oy=(H-vh*k)/2;
  var s=zoom;
  var ux=(px-W/2)/s+W/2, uy=(py-H/2)/s+H/2;
  return [ (ux-ox)/k, (uy-oy)/k ];
}
function drawCrop(canvas, targetW){
  var r=fRect();
  var tl=screenToVideo(r.left, r.top), br=screenToVideo(r.right, r.bottom);
  var sx=tl[0], sy=tl[1], sw=br[0]-tl[0], sh=br[1]-tl[1];
  var tw=targetW, th=Math.round(targetW*sh/sw);
  canvas.width=tw; canvas.height=th;
  canvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, tw, th);
}
function drawOriginal(canvas){
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
}

/* ---------- Файловая система ---------- */
async function ensureDir(){
  if (!FS) return false;
  await FS.mkdir({ path:DIR, directory:'DOCUMENTS', recursive:true }).catch(function(){});
  return true;
}
async function listFiles(){
  if (!FS) return [];
  try {
    var res = await FS.readdir({ path:DIR, directory:'DOCUMENTS' });
    return (res.files||[]).filter(function(f){ return /\.jpe?g$/i.test(f.name); });
  } catch(e){ return []; }
}
var NRE = /\d+/;
async function nextNumber(base){
  var files=await listFiles(), mx=0;
  for (var i=0;i<files.length;i++){
    var n=files[i].name;
    if (n===base+'.jpg') mx=Math.max(mx,1);
    var m=n.match(new RegExp('^'+base+'__([0-9]+)\\.jpg$'));
    if (m) mx=Math.max(mx, parseInt(m[1],10));
  }
  return mx+1;
}
function dataUrlOf(canvas){ return canvas.toDataURL('image/jpeg', .92); }
async function saveFile(name, canvas){
  if (FS){
    await FS.writeFile({ path:DIR+'/'+name, directory:'DOCUMENTS', data:dataUrlOf(canvas).split(',')[1] });
    return 'Документы / '+DIR+' / '+name;
  } else {
    var a=document.createElement('a'); a.href=dataUrlOf(canvas); a.download=name; a.click();
    return name+' (скачано браузером)';
  }
}

/* ---------- Снимок ---------- */
document.getElementById('shutter').addEventListener('click', async function(){
  if (!video.videoWidth){ toast('Камера ещё не готова'); return; }
  busy(true);
  try {
    await ensureDir();
    var base=MODES[curMode].file;
    var n=await nextNumber(base);
    var suffix=(n>1 ? '__'+n : '');
    var c1=document.createElement('canvas'); drawCrop(c1, MODES[curMode].targetW);
    var c2=document.createElement('canvas'); drawOriginal(c2);
    var p1=await saveFile(base+suffix+'.jpg', c1);
    var p2=await saveFile('original_'+n+'.jpg', c2);
    toast('Сохранено: '+p1.split('/').pop()+' + оригинал · в «Документы / '+DIR+'»', 4200);
  } catch(err){
    toast('Ошибка сохранения: '+(err && err.message ? err.message : err), 5000);
  }
  busy(false);
});

/* ---------- Галерея ---------- */
var gallery=document.getElementById('gallery');
function openGallery(){ gallery.classList.add('open'); renderGallery(); }
document.getElementById('gBack').onclick=function(){ gallery.classList.remove('open'); initCamera(); };
document.getElementById('gRefresh').onclick=renderGallery;
async function renderGallery(){
  var grid=document.getElementById('grid'), empty=document.getElementById('gEmpty');
  grid.innerHTML=''; empty.style.display='none';
  var files=await listFiles();
  files.sort(function(a,b){ return (b.mtime||0)-(a.mtime||0); });
  if (!files.length){ empty.style.display='block'; return; }
  files.slice(0,120).forEach(function(f, idx){
    setTimeout(async function(){
      try {
        var rd=await FS.readFile({ path:DIR+'/'+f.name, directory:'DOCUMENTS' });
        var data=(rd.data||'');
        if (data.indexOf('data:')!==0) data='data:image/jpeg;base64,'+data;
        var im=document.createElement('img');
        im.src=data; im.alt=f.name; im.dataset.name=f.name; im.dataset.url=data;
        im.onclick=function(){ openViewer(f.name, data); };
        grid.appendChild(im);
      } catch(e){}
    }, idx*30);
  });
}
var curFile=null;
function openViewer(name, dataUrl){
  curFile=name;
  document.getElementById('vImg').src=dataUrl;
  document.getElementById('vName').textContent=name+' · Документы / '+DIR;
  document.getElementById('viewer').classList.add('open');
}
document.getElementById('vClose').onclick=function(){
  document.getElementById('viewer').classList.remove('open');
  renderGallery();
};
document.getElementById('vDel').onclick=async function(){
  if (!curFile || !FS) return;
  try {
    await FS.deleteFile({ path:DIR+'/'+curFile, directory:'DOCUMENTS' });
    document.getElementById('viewer').classList.remove('open');
    toast('Удалено: '+curFile); renderGallery();
  } catch(e){ toast('Не удалось удалить'); }
};
document.getElementById('vShare').onclick=async function(){
  if (!curFile) return;
  var src=document.getElementById('vImg').src;
  try {
    var blob=await (await fetch(src)).blob();
    var file=new File([blob], curFile, { type:'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Sun Nails' });
    } else {
      toast('Отправка не поддерживается этим WebView', 4000);
    }
  } catch(e){
    if (e && e.name==='AbortError') return;
    toast('Не удалось открыть меню отправки', 4000);
  }
};

/* ---------- Старт ---------- */
layoutFrame(); markMode();
(async function(){
  if (!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem)){
    toast('Плагин файлов недоступен — работает режим браузера', 4000);
  }
  await initCamera();
})();
</script>
</body>
</html>
